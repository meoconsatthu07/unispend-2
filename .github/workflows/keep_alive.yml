name: Keep UniSpend 2.0 Awake 24/7

on:
  schedule:
    # Tự động kiểm tra & giữ web thức mỗi 6 tiếng
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud App
        run: |
          curl -fsSL -L --max-time 30 "https://thuvien01.streamlit.app/_stcore/health" || true
          curl -fsSL -L --max-time 30 "https://thuvien01.streamlit.app" -o /dev/null || true
